apiVersion: v1
kind: ConfigMap
metadata:
  name: grove-operator-cm-43dfd1c0
  namespace: grove-system
  labels:
    chart: "grove-charts-v0.0.0-g0f07586"
    release: "grove"
    app.kubernetes.io/component: operator-configmap
    app.kubernetes.io/name: grove-operator
    app.kubernetes.io/part-of: grove
immutable: true
data:
  config.yaml: |
    apiVersion: operator.config.grove.io/v1alpha1
    kind: OperatorConfiguration
    runtimeClientConnection:
      qps: 100
      burst: 150
    leaderElection:
      enabled: true
      leaseDuration: 15s
      renewDeadline: 10s
      retryPeriod: 2s
      resourceLock: leases
      resourceName: grove-operator-leader-election
      resourceNamespace: grove-system
    server:
      webhooks:
        port: 9443
      healthProbes:
        port: 9444
      metrics:
        port: 9445
    controllers:
      podCliqueSet:
        concurrentSyncs: 3
      podClique:
        concurrentSyncs: 3
    debugging:
      enableProfiling: false
    logLevel: info
    logFormat: json
    clusterTopology:
      enabled: false
      name: grove-topology

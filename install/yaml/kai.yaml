apiVersion: apps/v1
kind: Deployment
metadata:
  name: kai-operator
  namespace: kai-scheduler
  labels:
    app: kai-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kai-operator
  template:
    metadata:
      labels:
        app: kai-operator
    spec:
      serviceAccountName: kai-operator
      containers:
      - name: operator
        image: ccr.ccs.tencentyun.com/acejilam/ib-ag4sl3r8ot:cabc81f47537e23f75b3e00191734a36-v0.10.3
        # image: ghcr.io/nvidia/kai-scheduler/operator:v0.10.3
        imagePullPolicy: IfNotPresent
        args:
          - --metrics-bind-address=:8080
          - --health-probe-bind-address=:8081
          - --leader-elect=false
          - --qps=50
          - --burst=300
          - --namespace=kai-scheduler
        env:
        - name: WATCH_NAMESPACE
          value: kai-scheduler
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OPERATOR_NAME
          value: "kai-operator"
        - name: MS_REPOSITORY
          value: ghcr.io/nvidia/kai-scheduler
        - name: MS_TAG
          value: v0.10.3
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 8081
          name: probe
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10

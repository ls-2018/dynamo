apiVersion: kai.scheduler/v1
kind: Config
metadata:
  name: kai-config
  namespace: kai-scheduler
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "3"
spec:
  namespace: kai-scheduler
  global:
    replicaCount: 1

  binder:
    service:
      enabled: true
      image:
        name: binder
        repository: ghcr.io/nvidia/kai-scheduler
        tag: v0.10.3
        pullPolicy: IfNotPresent
    metricsPort: 8080
    resourceReservation:
      image:
        name: resourcereservation

  podGroupController:
    service:
      enabled: true
      image:
        name: podgroupcontroller
        repository: ghcr.io/nvidia/kai-scheduler
        tag: v0.10.3
        pullPolicy: IfNotPresent

  queueController:
    service:
      enabled: true
      image:
        name: queuecontroller
        repository: ghcr.io/nvidia/kai-scheduler
        tag: v0.10.3
        pullPolicy: IfNotPresent

  admission:
    service:
      enabled: true
      image:
        name: admission
        repository: ghcr.io/nvidia/kai-scheduler
        tag: v0.10.3
        pullPolicy: IfNotPresent
    gpuSharing: false
    queueLabelSelector: false
    webhook:
      port: 443
      targetPort: 9443
      probePort: 8081
      metricsPort: 8080
    gpuPodRuntimeClassName: nvidia

  nodeScaleAdjuster:
    service:
      enabled: false
      image:
        name: nodescaleadjuster
        repository: ghcr.io/nvidia/kai-scheduler
        tag: v0.10.3
        pullPolicy: IfNotPresent
    args:
      nodeScaleNamespace: kai-scale-adjust
      scalingPodImage:
        name: scalingpod
        repository: ghcr.io/nvidia/kai-scheduler
        tag: v0.10.3
        pullPolicy: IfNotPresent

  scheduler:
    service:
      image:
        name: scheduler
        repository: ghcr.io/nvidia/kai-scheduler
        tag: v0.10.3
        pullPolicy: IfNotPresent
    schedulerService:
      port: 8080

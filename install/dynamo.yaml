# This job is used to generate an SSH key pair and create a Kubernetes secret with the key pair.
# The secret is used when mpi is in use by dynamo workers.
apiVersion: batch/v1
kind: Job
metadata:
  name: dynamo-platform-dynamo-operator-ssh-keygen
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: dynamo-platform-dynamo-operator-ssh-keygen
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      initContainers:
      - name: keygen
        image: ccr.ccs.tencentyun.com/acejilam/ib-lzyrndm3qf:87846fbac4fa59fdf099811688de828f-latest
        # image: bitnamisecure/git:latest
        volumeMounts:
        - name: shared
          mountPath: /shared
        env:
        - name: SECRET_NAME
          value: "mpi-run-ssh-secret"
        - name: NAMESPACE
          value: "dynamo-system"
        command:
        - /bin/bash
        - -e
        - -c
        - |
          echo "Generating SSH key pair with ssh-keygen..."
          ssh-keygen -t rsa -b 2048 -f /shared/private.key -N ""
          echo "SSH keys generated and saved to shared volume"
      containers:
      - name: kubectl-create-secret
        image: ccr.ccs.tencentyun.com/acejilam/ib-wr0mfuk9d4:02cfda837d3edc5fee5f0fcac8ec12e0-1.34.1
        # image: alpine/k8s:1.34.1
        volumeMounts:
        - name: shared
          mountPath: /shared
        env:
        - name: SECRET_NAME
          value: "mpi-run-ssh-secret"
        - name: NAMESPACE
          value: "dynamo-system"
        command:
        - /bin/bash
        - -e
        - -c
        - |
          # Check if secret already exists
          if kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" &>/dev/null; then
            echo "Secret $SECRET_NAME already exists, skipping creation"
            exit 0
          fi
          echo "Creating Kubernetes secret..."
          kubectl create secret generic "$SECRET_NAME" \
            --from-file=private.key=/shared/private.key \
            --from-file=private.key.pub=/shared/private.key.pub \
            -n "$NAMESPACE"
          echo "SSH key secret created successfully"
      volumes:
      - name: shared
        emptyDir: {}

# Bare minimum infrastructure services for Dynamo.
# For observability (metrics, tracing, dashboards), use docker-observability.yml

networks:
  server:
    driver: bridge

services:
  nats-server:
    image: nats:2.11.4
    command: [ "-js", "--trace", "-m", "8222", "-c", "/nats-server.conf" ]
    volumes:
      - ./nats-server.conf:/nats-server.conf
      - ./accounts.conf:/accounts.conf
    ports:
      - 4222:4222
      - 6222:6222
      - 8222:8222  # the endpoints include /varz, /healthz, ...
    networks:
      - server

  nats-box:
    image: natsio/nats-box:0.14.5
    command: [ 'sleep', '1d']
    volumes:
      - ./box.txt:/nsc/.config/nats/context.txt
      - ./box.json:/nsc/.config/nats/context/default.json
      - ./box.json:/root/.config/nats/nats-context.json
    networks:
      - server

  nats-web:
    image: mdawar/nats-dashboard
    ports:
      - 8001:80
    environment:
      REVERSE_PROXY_UPSTREAM: 'etcd-server:8222'
      NATS_SERVER_NAME: 'Local NATS Server'
      NATS_SERVER_URL: 'http://localhost:8001/proxy/'
    networks:
      - server

  etcd-server:
    image: bitnamilegacy/etcd:3.6.1
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
    ports:
      - 2379:2379  # this port exposes the /metrics endpoint
      - 2380:2380
    networks:
      - server

  e3w:
    image: soyking/e3w:latest
    volumes:
      - ./e3w.ini:/app/conf/config.default.ini
    ports:
      - 8080:8080
    networks:
      - server

  jaeger:
    image: docker.io/jaegertracing/all-in-one
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: "9411"
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 6831:6831
      - 6832:6832
      - 5778:5778
      - 16686:16686   # ✅
      - 4317:4317
      - 4318:4318
      - 14250:14250
      - 14268:14268
      - 14269:14269
      - 9411:9411
    networks:
      - server
